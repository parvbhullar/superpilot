<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuriousKid AI Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">CuriousKid AI Assistant</h3>
                    </div>
                    <div class="card-body">
                        <form id="userForm" class="mb-4">
                            <div class="mb-3">
                                <label for="name" class="form-label">Your Name*</label>
                                <input type="text" class="form-control" id="name" required placeholder="Enter your name">
                            </div>
                            <div class="mb-3">
                                <label for="location" class="form-label">Location*</label>
                                <input type="text" class="form-control" id="location" required placeholder="Enter your city">
                            </div>
                            <div class="mb-3">
                                <label for="source" class="form-label">How did you hear about us?*</label>
                                <select class="form-control" id="source" required>
                                    <option value="">Select source</option>
                                    <option value="Instagram">Instagram</option>
                                    <option value="Facebook">Facebook</option>
                                    <option value="Google">Google</option>
                                    <option value="Friend">Friend Referral</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="startCall">Start Call with AI Assistant</button>
                        </form>

                        <div id="callSection" class="d-none">
                            <div class="text-center mb-3">
                                <div id="status" class="alert alert-info">Connecting...</div>
                            </div>
                            <div class="call-controls text-center">
                                <button id="muteAudio" class="btn btn-warning me-2">Mute</button>
                                <button id="endCall" class="btn btn-danger">End Call</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/livekit-client"></script>
    <script src="/static/main.js"></script>
</body>
</html>
